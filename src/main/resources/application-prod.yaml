spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
